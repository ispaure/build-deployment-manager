[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "build-deployment-manager"
version = "0.1.0"
requires-python = ">=3.12"
description = "Project-independent build and deployment supervision"
dependencies = []

[dependency-groups]
gui = ["PySide6==6.10.0"]

[tool.uv]
default-groups = ["gui"]

[project.scripts]
build-manager = "build_manager.cli:main"
build-manager-gui = "build_manager.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["build_manager*"]
